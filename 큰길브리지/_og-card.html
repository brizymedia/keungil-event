<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  font-family:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif;
  background:#07090F;color:#EDEAE3;position:relative;letter-spacing:-.02em;
  -webkit-font-smoothing:antialiased;
}
.bg{position:absolute;inset:0;
  background:
    radial-gradient(110% 80% at 80% 12%, rgba(63,211,198,.16), transparent 58%),
    radial-gradient(95% 75% at 8% 88%, rgba(232,184,75,.18), transparent 60%),
    linear-gradient(165deg,#080B12 0%,#0A0E17 48%,#07090F 100%);
}
.grid{position:absolute;inset:0;opacity:.55;
  background-image:linear-gradient(rgba(237,234,227,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(237,234,227,.09) 1px,transparent 1px);
  background-size:78px 78px;
  -webkit-mask-image:radial-gradient(85% 70% at 45% 40%,#000 18%,transparent 76%);
}
.bridge{position:absolute;left:0;right:0;bottom:0;width:1200px;height:300px;opacity:.9}
.wrap{position:relative;padding:62px 70px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:46px;height:46px}
.bk{font-size:25px;font-weight:800;letter-spacing:-.04em;line-height:1}
.be{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.26em;color:#5C6577;margin-top:6px}
.eyebrow{display:inline-flex;align-items:center;gap:11px;margin-top:52px;
  padding:9px 19px 9px 13px;border-radius:99px;border:1px solid rgba(237,234,227,.2);
  background:rgba(237,234,227,.045);font-family:"JetBrains Mono",monospace;
  font-size:12.5px;letter-spacing:.15em;color:#9AA3B2;align-self:flex-start}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:#3FD3C6;box-shadow:0 0 0 5px rgba(63,211,198,.2)}
h1{margin-top:30px;font-size:76px;font-weight:800;line-height:1.06;letter-spacing:-.055em}
h1 .g{color:#E8B84B;
  background:linear-gradient(90deg,rgba(232,184,75,.42),rgba(255,107,74,.3));
  background-repeat:no-repeat;background-size:100% .16em;background-position:0 .84em}
h1 .t{font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;color:#9AA3B2}
.chips{display:flex;gap:11px;margin-top:auto;margin-bottom:26px}
.chip{padding:11px 20px;border-radius:99px;border:1px solid rgba(237,234,227,.17);
  background:rgba(237,234,227,.04);font-size:17px;font-weight:600;color:#EDEAE3}
.chip b{color:#E8B84B;font-weight:800}
.foot{display:flex;align-items:flex-end;justify-content:space-between}
.tel{display:flex;align-items:center;gap:15px}
.tic{width:52px;height:52px;border-radius:15px;background:#E8B84B;display:grid;place-items:center}
.tic svg{width:25px;height:25px;color:#07090F}
.tl{font-family:"JetBrains Mono",monospace;font-size:10.5px;letter-spacing:.2em;color:#5C6577}
.tn{font-size:35px;font-weight:900;letter-spacing:-.035em;color:#E8B84B;line-height:1.1}
.rep{text-align:right;font-size:15px;color:#5C6577;line-height:1.9}
.rep b{color:#9AA3B2;font-weight:700}
</style></head><body>
<div class="bg"></div><div class="grid"></div>

<svg class="bridge" viewBox="0 0 1200 300" preserveAspectRatio="none">
  <path d="M300 300 V70 M900 300 V70" stroke="rgba(237,234,227,.2)" stroke-width="1.6" fill="none"/>
  <path d="M0 165 Q150 45 300 70 Q600 265 900 70 Q1050 45 1200 165"
        stroke="rgba(232,184,75,.42)" stroke-width="1.6" fill="none"/>
  <path d="M0 240 H1200" stroke="rgba(63,211,198,.5)" stroke-width="2" fill="none"/>
  <g stroke="rgba(237,234,227,.14)" stroke-width="1.1">
    <line x1="100" y1="240" x2="100" y2="103"/><line x1="170" y1="240" x2="170" y2="82"/>
    <line x1="240" y1="240" x2="240" y2="70"/><line x1="380" y1="240" x2="380" y2="112"/>
    <line x1="460" y1="240" x2="460" y2="150"/><line x1="540" y1="240" x2="540" y2="178"/>
    <line x1="600" y1="240" x2="600" y2="186"/><line x1="660" y1="240" x2="660" y2="178"/>
    <line x1="740" y1="240" x2="740" y2="150"/><line x1="820" y1="240" x2="820" y2="112"/>
    <line x1="960" y1="240" x2="960" y2="70"/><line x1="1030" y1="240" x2="1030" y2="82"/>
    <line x1="1100" y1="240" x2="1100" y2="103"/>
  </g>
  <circle cx="812" cy="240" r="4.5" fill="#E8B84B"/>
</svg>

<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 40 40" fill="none">
      <path d="M2 30 C 10 12, 30 12, 38 30" stroke="#E8B84B" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M2 30 H38" stroke="#3FD3C6" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M11 30 V20.5 M20 30 V17 M29 30 V20.5" stroke="#EDEAE3" stroke-opacity=".45" stroke-width="1.4"/>
      <circle cx="20" cy="17" r="2.8" fill="#E8B84B"/>
    </svg>
    <div><div class="bk">큰길브리지</div><div class="be">KEUNGIL BRIDGE</div></div>
  </div>

  <span class="eyebrow"><i></i>소상공인 · 가수 · 이벤트인을 위한 홈페이지</span>

  <h1>거품은 걷어내고,<br><span class="g">10만원</span>으로 시작하는 <span class="t">홈페이지.</span></h1>

  <div class="chips">
    <span class="chip">반응형 홈페이지 <b>10만원~</b></span>
    <span class="chip">숏폼 홍보영상 <b>10만원~</b></span>
    <span class="chip">AI 클래스 <b>준비중</b></span>
  </div>

  <div class="foot">
    <div class="tel">
      <span class="tic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg></span>
      <span><span class="tl">대표번호 / 무료상담</span><div class="tn">1533-7295</div></span>
    </div>
    <div class="rep">대표 <b>김효민</b><br>홈페이지 · 홍보영상 · AI 강의</div>
  </div>
</div>
</body></html>
