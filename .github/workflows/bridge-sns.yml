name: 큰길브리지 SNS 자동화

# 스레드 · 인스타 · 유튜브 쇼츠 자동 게시 + 댓글 키워드 자동 응대 + 잠재 고객 찾기 + 토큰 연장.
# 원고는 bridge-funnel/sns/content.json · tips.json. 어디까지 올렸는지는 bridge-funnel/sns/state.json 에 커밋된다.
# 설치 · 시크릿 넣는 법: bridge-funnel/README.md 「3. SNS 자동화 연결」
# 잠깐 멈추려면: Settings → Secrets and variables → Actions → Variables 에 SNS_PAUSED = 1
on:
  schedule:
    - cron: '52 23 * * *'        # 08:52 KST  스레드 — 원고 (캐러셀)
    - cron: '10 3 * * *'         # 12:10 KST  인스타 — 캐러셀
    - cron: '7 11 * * *'         # 20:07 KST  스레드 — 짧은 질문형 글
    - cron: '13 10 * * 2,4,6'    # 화 · 목 · 토 19:13 KST  인스타 릴스
    - cron: '17 9 * * 1,3,5'     # 월 · 수 · 금 18:17 KST  유튜브 쇼츠
    - cron: '11,41 * * * *'      # 30분마다  댓글 자동 응대
    - cron: '23 22 * * *'        # 07:23 KST  잠재 고객 글 찾기 → 메일
    - cron: '37 18 * * 0'        # 월요일 03:37 KST  토큰 연장
  push:
    branches: [main]
    paths: ['bridge-funnel/sns/content.json', 'bridge-funnel/sns/card.html']
  workflow_dispatch:
    inputs:
      task:
        description: '할 일'
        type: choice
        options: [threads, threads-tip, instagram, reels, youtube, reply, listen, refresh, render]
        default: threads
      id:
        description: '특정 글 id (예: p07) — 비우면 다음 순서'
        required: false
      dry:
        description: '연습 (실제로 올리지 않음)'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: bridge-sns
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    if: vars.SNS_PAUSED != '1'
    timeout-minutes: 20
    defaults:
      run:
        working-directory: bridge-funnel/sns
    env:
      THREADS_TOKEN: ${{ secrets.THREADS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
      IG_TOKEN: ${{ secrets.IG_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      YT_PRIVACY: ${{ vars.YT_PRIVACY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AI_REPLY: ${{ vars.AI_REPLY }}
      BRIDGE_LANDING: ${{ vars.BRIDGE_LANDING }}
      BRIDGE_CARDS_BASE: ${{ vars.BRIDGE_CARDS_BASE }}
      BRIDGE_FUNNEL_API: ${{ vars.BRIDGE_FUNNEL_API }}
      BRIDGE_FUNNEL_KEY: ${{ secrets.BRIDGE_FUNNEL_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 할 일 정하기
        id: t
        working-directory: .
        run: |
          case "${{ github.event_name }}:${{ github.event.schedule }}" in
            "schedule:52 23 * * *")     T=threads ;;
            "schedule:10 3 * * *")      T=instagram ;;
            "schedule:7 11 * * *")      T=threads-tip ;;
            "schedule:13 10 * * 2,4,6") T=reels ;;
            "schedule:17 9 * * 1,3,5")  T=youtube ;;
            "schedule:11,41 * * * *")   T=reply ;;
            "schedule:23 22 * * *")     T=listen ;;
            "schedule:37 18 * * 0")     T=refresh ;;
            push:*)                     T=render ;;
            *)                          T="${{ inputs.task }}" ;;
          esac
          ARGS=""
          if [ -n "${{ inputs.id }}" ]; then ARGS="$ARGS --id ${{ inputs.id }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry }}" = "true" ]; then ARGS="$ARGS --dry"; fi
          echo "task=$T" >> "$GITHUB_OUTPUT"; echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          echo "할 일: $T $ARGS"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 답한 댓글 · 찾은 글 기록 — 30분마다 커밋하지 않도록 Actions 캐시에 둔다 (날아가도 답글 중복 확인을 한 번 더 한다)
      - name: 응대 기록 불러오기
        uses: actions/cache@v4
        with:
          path: bridge-funnel/sns/.cache
          key: sns-memo-${{ github.run_id }}
          restore-keys: sns-memo-

      - name: 준비물 설치
        run: |
          npm install --no-audit --no-fund --omit=optional
          case "${{ steps.t.outputs.task }}" in
            render|reels|youtube) npx playwright install --with-deps chromium; ffmpeg -version | head -1 ;;
          esac

      - name: 원고 검사
        run: node check.mjs

      - name: 실행
        run: |
          case "${{ steps.t.outputs.task }}" in
            render)  node render.mjs ;;
            reply)   node reply.mjs ${{ steps.t.outputs.args }} ;;
            listen)  node listen.mjs ${{ steps.t.outputs.args }} ;;
            refresh) node refresh-token.mjs ;;
            *)       node post.mjs ${{ steps.t.outputs.task }} ${{ steps.t.outputs.args }} ;;
          esac

      - name: 연장된 토큰 저장
        if: steps.t.outputs.task == 'refresh'
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "SECRETS_PAT 시크릿이 없어 토큰을 자동으로 바꿔 넣지 못했습니다 — README 참고"; exit 0; fi
          for n in THREADS_TOKEN IG_TOKEN; do
            f="$RUNNER_TEMP/$n"
            if [ -s "$f" ]; then gh secret set "$n" --repo "${{ github.repository }}" < "$f" && echo "$n 갱신"; rm -f "$f"; fi
          done

      - name: 상태 · 카드 커밋
        if: always()
        working-directory: .
        run: |
          git config user.name "sns-bot"
          git config user.email "sns-bot@users.noreply.github.com"
          git add bridge-funnel/sns/state.json bridge-funnel/sns/cards 2>/dev/null || true
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -q -m "SNS 자동화 — ${{ steps.t.outputs.task }} $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((i*4)); git pull -q --rebase origin main
          done
          exit 1
