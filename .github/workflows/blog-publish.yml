name: 블로그 글 게시

# 블로그 루틴(클라우드 에이전트)이 claude/blog-YYYY-MM-DD 가지에 새 글 JSON 을 올리면
#   검사 → 사이트 생성(블로그 · sitemap · RSS) → main 반영 → 가지 삭제 → 네이버 · IndexNow 에 새 주소 알림.
# 가지에서 가져오는 것은 _blog/posts/ 에 새로 생긴 글 파일뿐이다. 루틴은 다른 파일을 바꿀 수 없다.
on:
  push:
    branches: ['claude/blog-2*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blog-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 가지에서 새 글만 가져오기
        id: take
        run: |
          BR="${GITHUB_REF_NAME}"
          if [ "$BR" = "main" ]; then echo "new=" >> "$GITHUB_OUTPUT"; exit 0; fi
          git fetch origin "$BR"
          NEW=$(git -c core.quotepath=false diff --name-only --diff-filter=A origin/main "origin/$BR" -- '_blog/posts/*.json' | tr '\n' ' ' | sed 's/ *$//')
          if [ -z "$NEW" ]; then echo "새 글 없음"; echo "new=" >> "$GITHUB_OUTPUT"; exit 0; fi
          git checkout "origin/$BR" -- $NEW
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "가져온 글: $NEW"

      - name: 글 검사
        if: steps.take.outputs.new != ''
        run: node scripts/blog-check.mjs --new ${{ steps.take.outputs.new }}

      - name: 사이트 만들고 main 에 반영
        if: steps.take.outputs.new != ''
        run: |
          git config user.name "blog-bot"
          git config user.email "blog-bot@users.noreply.github.com"
          BR="${GITHUB_REF_NAME}"
          NEW="${{ steps.take.outputs.new }}"
          COUNT=$(echo $NEW | wc -w)
          for i in 1 2 3; do
            node scripts/build-gallery.mjs
            git add -A _blog/posts blog gallery.html sitemap.xml rss.xml stories
            if git diff --cached --quiet; then echo "변경 없음"; break; fi
            git commit -m "블로그 글 ${COUNT}개 게시 — ${BR#claude/blog-}"
            if git push origin HEAD:main; then break; fi
            if [ "$i" = "3" ]; then echo "main 반영 실패"; exit 1; fi
            echo "푸시 거절 — 최신 main 위에 다시 얹는다 ($i)"
            git fetch origin main && git reset --hard origin/main
            git checkout "origin/$BR" -- $NEW
          done
          git push origin --delete "$BR" || true

      - name: 검색엔진에 새 주소 알리기 (네이버 서치어드바이저 · IndexNow)
        if: steps.take.outputs.new != ''
        env:
          INDEXNOW_KEY: cbf3391960c1763a0c95cfedd7a5ace1
        run: |
          SITE="https://xn--wk0bn7yi8h24iszc.com"
          URLS=$(node -e '
            const fs = require("fs");
            const 주소 = ["/blog/"];
            for (const f of process.argv.slice(1)) {
              const p = JSON.parse(fs.readFileSync(f, "utf8"));
              주소.push("/blog/" + p.region + "/", "/blog/" + encodeURIComponent(p.slug) + "/");
            }
            console.log(JSON.stringify([...new Set(주소)].map((u) => "https://xn--wk0bn7yi8h24iszc.com" + u)));
          ' ${{ steps.take.outputs.new }})
          LAST=$(node -e 'console.log(JSON.parse(process.argv[1]).at(-1))' "$URLS")
          # GitHub Pages 에 올라갈 때까지 기다린다 (최대 10분)
          for i in $(seq 1 40); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$LAST")
            if [ "$CODE" = "200" ]; then echo "게시 확인: $LAST"; break; fi
            sleep 15
          done
          BODY=$(printf '{"host":"xn--wk0bn7yi8h24iszc.com","key":"%s","keyLocation":"%s/%s.txt","urlList":%s}' "$INDEXNOW_KEY" "$SITE" "$INDEXNOW_KEY" "$URLS")
          curl -s -o /dev/null -w 'naver %{http_code}\n' -X POST -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" https://searchadvisor.naver.com/indexnow || true
          curl -s -o /dev/null -w 'indexnow %{http_code}\n' -X POST -H 'Content-Type: application/json; charset=utf-8' -d "$BODY" https://api.indexnow.org/indexnow || true
