name: 갤러리 페이지 · 사이트맵 자동 갱신

# photos 브랜치의 photos.json 이 바뀌면(사진 업로드) 정적 gallery.html 과 sitemap.xml 을 다시 만들어 main 에 커밋한다.
# → 검색엔진·AI 크롤러가 JS 없이도 행사명·장소·설명·사진을 읽을 수 있게 됨.
on:
  schedule:
    - cron: '17 */6 * * *'        # 6시간마다 (UTC)
  workflow_dispatch:              # Actions 탭에서 수동 실행
  repository_dispatch:            # upload.html 로 사진을 올리면 바로 (앱스 스크립트가 보냄)
    types: [photos-updated]
  push:
    branches: [main]
    paths:
      - 'scripts/build-gallery.mjs'
      - 'scripts/build-stories.mjs'
      - 'scripts/build-blog.mjs'
      - '_blog/posts/**'
      - '_blog/regions.json'
      - '.github/workflows/gallery.yml'

permissions:
  contents: write

concurrency:
  group: gallery-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 갤러리 · 행사 이야기 · 사이트맵 생성
        run: node scripts/build-gallery.mjs
      - name: 변경 있으면 커밋
        run: |
          git config user.name "gallery-bot"
          git config user.email "gallery-bot@users.noreply.github.com"
          # 지운 행사의 글 페이지도 사라져야 하므로 -A 로 stories/ 삭제까지 담는다
          # 블로그 게시 워크플로와 동시에 main 에 밀어 넣으면 한쪽이 거절된다 → 최신 main 에서 다시 만들어 재시도
          for i in 1 2 3; do
            git add -A gallery.html sitemap.xml rss.xml stories blog
            if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
            git commit -m "갤러리 · 행사 이야기 · 사이트맵 자동 갱신"
            if git push origin HEAD:main; then exit 0; fi
            echo "푸시 거절 — 최신 main 에서 다시 만든다 ($i)"
            git fetch origin main && git reset --hard origin/main
            node scripts/build-gallery.mjs
          done
          exit 1
