name: 큰길행사알림 APK 만들기

# 안드로이드 스튜디오를 깔지 않고 여기서 APK 를 만든다.
# 다 만들어지면 Actions 탭의 실행 기록 맨 아래 Artifacts 에서 내려받으면 된다.

on:
  workflow_dispatch:            # Actions 탭에서 손으로 실행
  push:
    branches: [main]
    paths:
      - 'keungil-alert/**'
      - '.github/workflows/alert-apk.yml'

permissions:
  contents: write        # 홈페이지 /app/ 에 APK 를 커밋해야 한다

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 자바 준비
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 안드로이드 SDK 준비
        uses: android-actions/setup-android@v3

      - name: 그레이들 준비
        uses: gradle/actions/setup-gradle@v4

      - name: APK 만들기
        working-directory: keungil-alert
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK 올리기
        uses: actions/upload-artifact@v4
        with:
          name: 큰길행사알림-apk
          path: keungil-alert/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      # Actions 아티팩트는 깃허브에 로그인해야 받아진다. 폰에서는 그게 안 되므로
      # 홈페이지 /app/ 에도 같이 올려둔다. robots.txt 로 검색에서는 빼놨다.
      - name: 홈페이지 /app/ 에 올리기
        run: |
          cp keungil-alert/app/build/outputs/apk/debug/app-debug.apk app/keungil-alert.apk
          if git diff --quiet -- app/keungil-alert.apk; then
            echo "APK 가 그대로다 — 올릴 것 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/keungil-alert.apk
          git commit -m "큰길행사알림 APK 새로 올림 ($GITHUB_SHA)"
          # checkout 은 브랜치가 아니라 SHA 를 받아오므로(detached HEAD)
          # 그냥 git push 하면 "현재 브랜치가 없다" 며 실패한다.
          git push origin HEAD:${{ github.ref_name }}
