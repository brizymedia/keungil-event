<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- SNS 카드 한 장 틀. render.mjs 가 window.CARD 를 넣고 1080×1350(피드) 또는 1080×1920(쇼츠 · 릴스)로 찍는다 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body.story{height:1920px}
body{background:#07090F;color:#EDEAE3;font-family:"Pretendard Variable",Pretendard,sans-serif;letter-spacing:-.035em;word-break:keep-all;position:relative}
.bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 85% -5%,rgba(232,184,75,.20),transparent 60%),radial-gradient(800px 700px at -10% 105%,rgba(63,211,198,.14),transparent 60%)}
.arc{position:absolute;right:-120px;bottom:120px;width:760px;opacity:.18}
body.story .arc{bottom:-40px;opacity:.12}
.in{position:absolute;inset:0;padding:110px 96px 0;display:flex;flex-direction:column}
body.story .in{padding-top:300px}
.k{display:inline-flex;align-self:flex-start;font-size:34px;font-weight:700;color:#3FD3C6;border:2px solid rgba(63,211,198,.45);border-radius:999px;padding:10px 26px;margin-bottom:56px}
h1{font-size:92px;line-height:1.2;font-weight:800;white-space:pre-line;letter-spacing:-.045em}
h1 em{font-style:normal;color:#E8B84B}
.b{font-size:44px;line-height:1.6;color:#B7BECB;margin-top:52px;white-space:pre-line;font-weight:500}
.hook h1{font-size:112px}
.hook .b{color:#EDEAE3}
.num{position:absolute;top:96px;right:96px;font-size:30px;font-weight:700;color:#5C6577}
body.story .num{top:220px}
.foot{position:absolute;left:96px;right:96px;bottom:84px;display:flex;align-items:center;justify-content:space-between;font-size:32px;color:#9AA3B2;font-weight:600}
body.story .foot{bottom:260px}
.logo{display:flex;align-items:center;gap:16px;color:#EDEAE3;font-weight:800;font-size:36px}
.logo svg{width:52px;height:52px}
.swipe{color:#E8B84B}
/* CTA 장 */
.cta .box{margin-top:60px;background:#E8B84B;color:#07090F;border-radius:36px;padding:54px 56px}
.cta .box b{display:block;font-size:40px;font-weight:700;opacity:.75}
.cta .box strong{display:block;font-size:84px;font-weight:800;line-height:1.25;margin-top:10px}
.cta .gifts{display:flex;gap:18px;margin-top:44px;flex-wrap:wrap}
.cta .gifts span{font-size:36px;font-weight:700;border:2px solid rgba(237,234,227,.25);border-radius:999px;padding:14px 28px;background:#07090F}
.cta .or{font-size:36px;color:#9AA3B2;margin-top:44px;line-height:1.6}
.cta .or b{color:#EDEAE3}
</style>
</head>
<body>
<div class="bg"></div>
<svg class="arc" viewBox="0 0 40 40" fill="none"><path d="M2 30 C 10 12, 30 12, 38 30" stroke="#E8B84B" stroke-width="1.2" stroke-linecap="round"/><path d="M2 30 H38" stroke="#3FD3C6" stroke-width="1.2" stroke-linecap="round"/><circle cx="20" cy="17" r="1.6" fill="#E8B84B"/></svg>
<div class="in" id="in"></div>
<div class="num" id="num"></div>
<div class="foot"><div class="logo"><svg viewBox="0 0 40 40" fill="none"><path d="M2 30 C 10 12, 30 12, 38 30" stroke="#E8B84B" stroke-width="2.6" stroke-linecap="round"/><path d="M2 30 H38" stroke="#3FD3C6" stroke-width="2.6" stroke-linecap="round"/><circle cx="20" cy="17" r="3" fill="#E8B84B"/></svg>큰길브리지</div><div id="right"></div></div>
<script>
(function(){
  var C = window.CARD || { kind:'hook', k:'AI 검색 시대', t:'손님은 이제\n검색하지 않습니다', b:'AI에게 묻습니다', i:1, n:5, story:false };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  /* 마지막 줄을 금색으로 — 제목의 결론 부분을 강조 */
  var 제목 = function(t){ var L = esc(t).split('\n'); if(L.length > 1) L[L.length-1] = '<em>' + L[L.length-1] + '</em>'; return L.join('\n'); };
  if(C.story) document.body.classList.add('story');
  var h = '';
  if(C.kind === 'cta'){
    document.body.classList.add('cta');
    var 선물 = { '전자책':'📘 전자책 「AI가 추천하는 가게의 7가지 조건」', '데모':'🖥 우리 가게 홈페이지 데모', '견적':'💰 1분 자동 견적', '명함':'📇 무료 모바일 전자명함' };
    h += '<div class="k">무료로 드려요</div><h1>' + esc(선물[C.kw] || '무료 자료') + '</h1>';
    h += '<div class="box"><b>' + (C.story ? '프로필 링크 · 댓글에' : '댓글에') + '</b><strong>「' + esc(C.kw) + '」</strong><b style="margin-top:8px">남기시면 DM으로 보내 드려요</b></div>';
    h += '<div class="gifts"><span>전자책</span><span>전자명함</span><span>홈페이지 데모</span></div>';
    h += '<p class="or">전화 · 가입 없이 · <b>www.ai-make.co.kr</b></p>';
  } else {
    if(C.kind === 'hook') document.body.classList.add('hook');
    h += '<div class="k">' + esc(C.k) + '</div><h1>' + 제목(C.t) + '</h1>' + (C.b ? '<p class="b">' + esc(C.b) + '</p>' : '');
  }
  document.getElementById('in').innerHTML = h;
  /* 제목이 길면 글자를 줄여 네 줄 안쪽으로 (본문 · 바닥글과 겹치지 않게) */
  var h1 = document.querySelector('h1'), 최대 = C.kind === 'cta' ? 340 : 480, fs = parseFloat(getComputedStyle(h1).fontSize);
  while(h1.offsetHeight > 최대 && fs > 56){ fs -= 4; h1.style.fontSize = fs + 'px'; }
  document.getElementById('num').textContent = C.i + ' / ' + C.n;
  document.getElementById('right').innerHTML = C.i < C.n ? '<span class="swipe">' + (C.story ? '' : '넘겨 보기 →') + '</span>' : '저장 · 공유 📌';
})();
</script>
</body>
</html>
